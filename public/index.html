<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregnancy Calendar Studio</title>
<style>
  :root{ --pink:#b267a3; --cream:#fbf7f2; --ink:#4a4458; --muted:#8a8397; --line:#e7ddd2; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Segoe UI',system-ui,sans-serif; color:var(--ink); background:#efe9e1; }
  header{ background:var(--cream); border-bottom:1px solid var(--line); padding:16px 26px; }
  header h1{ font-size:20px; margin:0; }
  header p{ margin:3px 0 0; font-size:13px; color:var(--muted); }
  .wrap{ max-width:1100px; margin:0 auto; padding:22px 26px 60px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:22px; box-shadow:0 4px 16px rgba(0,0,0,.05); }
  .card h2{ font-size:14px; margin:0 0 14px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  form.add{ display:grid; grid-template-columns:1.4fr 1fr .8fr 1.3fr 1fr auto; gap:12px; align-items:end; }
  .field{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .field label{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  input, select{ padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; width:100%; }
  .btn{ border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn.primary{ background:var(--pink); color:#fff; }
  .btn.ghost{ background:#fff; border:1px solid var(--line); color:var(--ink); }
  .btn.sm{ padding:6px 10px; font-size:12.5px; }
  .btn.link{ background:none; border:0; color:var(--pink); font-weight:600; cursor:pointer; padding:6px 8px; font-size:12.5px; }
  .btn.link.danger{ color:#b34b4b; }
  table{ width:100%; border-collapse:collapse; }
  th, td{ padding:11px 12px; border-bottom:1px solid var(--line); font-size:13.5px; text-align:left; vertical-align:middle; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  td .nm{ font-weight:600; }
  td .sub{ color:var(--muted); font-size:12px; }
  .pill{ display:inline-block; background:#f3e8f0; color:var(--pink); border-radius:20px; padding:2px 9px; font-size:11.5px; font-weight:600; }
  .actions{ display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end; }
  .empty{ text-align:center; color:var(--muted); padding:40px 0; }
  .err{ color:#b34b4b; font-size:13px; margin-top:8px; min-height:16px; }
</style>
</head>
<body>
<header>
  <h1>🤰 Pregnancy Calendar Studio</h1>
  <p>Add a customer’s details once — generate their personalized 10-page calendar, PDF, or data table.</p>
</header>
<div class="wrap">

  <div class="card">
    <h2>Add customer</h2>
    <form class="add" id="addForm" autocomplete="off">
      <div class="field"><label>Name *</label><input name="name" required placeholder="e.g. Emma Schmidt"></div>
      <div class="field"><label>Due date *</label><input name="due_date" type="date" required></div>
      <div class="field"><label>Language</label>
        <select name="lang"><option value="en">English</option><option value="de">Deutsch</option></select>
      </div>
      <div class="field"><label>Email</label><input name="email" type="email" placeholder="optional"></div>
      <div class="field"><label>Order / ref</label><input name="order_ref" placeholder="optional"></div>
      <button class="btn primary" type="submit">Add</button>
    </form>
    <div class="field" style="margin-top:12px"><label>Notes</label><input id="notes" name="notes" placeholder="optional notes"></div>
    <div class="err" id="err"></div>
  </div>

  <div class="card">
    <h2>Customers</h2>
    <div id="tableWrap"></div>
  </div>
</div>

<script>
  const $ = (s, r=document) => r.querySelector(s);
  const esc = (s) => (s==null?'':String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const q = (c) => 'due=' + encodeURIComponent(c.due_date) + '&lang=' + c.lang + '&name=' + encodeURIComponent(c.name);

  // Current gestational week from due date (due date = end of week 40)
  function weekNow(due){
    const d = new Date(due + 'T00:00:00'); const today = new Date(); today.setHours(0,0,0,0);
    const daysToDue = Math.round((d - today) / 86400000);
    const wk = 40 - daysToDue / 7;
    if (wk < 1) return '<span class="sub">not started</span>';
    if (wk > 41) return '<span class="sub">due passed</span>';
    return '<span class="pill">Week ' + Math.round(wk) + '</span>';
  }
  const fmt = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(); };

  async function load(){
    const list = await (await fetch('/api/customers')).json();
    const wrap = $('#tableWrap');
    if (!list.length){ wrap.innerHTML = '<div class="empty">No customers yet — add one above to generate their calendar.</div>'; return; }
    wrap.innerHTML = '<table><thead><tr>' +
      '<th>Name</th><th>Due date</th><th>Language</th><th>Now</th><th>Added</th><th style="text-align:right">Actions</th>' +
      '</tr></thead><tbody>' + list.map(c => {
        const url = q(c);
        return '<tr>' +
          '<td><div class="nm">' + esc(c.name) + '</div>' + (c.email? '<div class="sub">' + esc(c.email) + '</div>':'') +
             (c.order_ref? '<div class="sub">#' + esc(c.order_ref) + '</div>':'') + '</td>' +
          '<td>' + esc(c.due_date) + '</td>' +
          '<td>' + (c.lang==='de'?'Deutsch':'English') + '</td>' +
          '<td>' + weekNow(c.due_date) + '</td>' +
          '<td class="sub">' + fmt(c.created_at) + '</td>' +
          '<td><div class="actions">' +
            '<a class="btn link" target="_blank" href="/preview?' + url + '">👁 View</a>' +
            '<a class="btn link" href="/pdf?' + url + '">⬇ PDF</a>' +
            '<a class="btn link" target="_blank" href="/data?' + url + '">📋 Data</a>' +
            '<button class="btn link danger" data-del="' + c.id + '">✕</button>' +
          '</div></td>' +
        '</tr>';
      }).join('') + '</tbody></table>';
    wrap.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('Delete this customer?')) return;
      await fetch('/api/customers/' + b.dataset.del, { method:'DELETE' });
      load();
    });
  }

  $('#addForm').onsubmit = async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = {
      name: f.name.value, due_date: f.due_date.value, lang: f.lang.value,
      email: f.email.value, order_ref: f.order_ref.value, notes: $('#notes').value
    };
    const res = await fetch('/api/customers', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    if (!res.ok){ $('#err').textContent = (await res.json()).error || 'Could not add customer'; return; }
    $('#err').textContent = ''; f.reset(); $('#notes').value = ''; load();
  };

  load();
</script>
</body>
</html>
