<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pregnancy Calendar Generator</title>
<style>
  :root{ --pink:#b267a3; --cream:#fbf7f2; --ink:#4a4458; --line:#e7ddd2; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Segoe UI',system-ui,sans-serif; color:var(--ink); background:#efe9e1; }
  header{ background:var(--cream); border-bottom:1px solid var(--line); padding:16px 26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header h1{ font-size:19px; margin:0; font-weight:700; }
  header .tag{ font-size:12.5px; color:#8a8397; }
  .bar{ display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-left:auto; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#8a8397; }
  input[type=date]{ padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
  .seg button{ border:0; background:#fff; padding:8px 14px; font-size:14px; cursor:pointer; color:#8a8397; }
  .seg button.on{ background:var(--pink); color:#fff; }
  .btn{ border:0; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn.primary{ background:var(--pink); color:#fff; }
  .btn.ghost{ background:#fff; border:1px solid var(--line); color:var(--ink); }
  .btn:disabled{ opacity:.55; cursor:default; }
  main{ padding:0; }
  iframe{ width:100%; height:calc(100vh - 66px); border:0; background:#efe9e1; display:block; }
  .note{ font-size:12px; color:#8a8397; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🤰 Pregnancy Calendar Generator</h1>
    <div class="tag">One due date in → a personalized 10-page calendar out</div>
  </div>
  <div class="bar">
    <div class="field">
      <label for="due">Due date</label>
      <input type="date" id="due" value="2026-10-15">
    </div>
    <div class="field">
      <label>Language</label>
      <div class="seg" id="lang">
        <button data-l="en" class="on">English</button>
        <button data-l="de">Deutsch</button>
      </div>
    </div>
    <button class="btn primary" id="update">Update preview</button>
    <button class="btn ghost" id="pdf">⬇ Download PDF</button>
  </div>
</header>
<main>
  <iframe id="frame" src="/preview?due=2026-10-15&lang=en"></iframe>
</main>
<script>
  let lang = 'en';
  const frame = document.getElementById('frame');
  const due = document.getElementById('due');
  function url(base){ return base + '?due=' + encodeURIComponent(due.value) + '&lang=' + lang; }
  function refresh(){ frame.src = url('/preview'); }
  document.getElementById('update').onclick = refresh;
  due.onchange = refresh;
  document.querySelectorAll('#lang button').forEach(b => b.onclick = () => {
    lang = b.dataset.l;
    document.querySelectorAll('#lang button').forEach(x => x.classList.toggle('on', x === b));
    refresh();
  });
  document.getElementById('pdf').onclick = () => {
    const btn = document.getElementById('pdf');
    btn.disabled = true; btn.textContent = 'Generating…';
    const a = document.createElement('a'); a.href = url('/pdf');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { btn.disabled = false; btn.textContent = '⬇ Download PDF'; }, 3500);
  };
</script>
</body>
</html>
